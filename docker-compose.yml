services:
  mysql:
    image: mysql:8.4
    container_name: flight-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flight_booking
      MYSQL_USER: flight_booking
      MYSQL_PASSWORD: flight_booking
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./flight_booking.sql:/docker-entrypoint-initdb.d/flight_booking.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
